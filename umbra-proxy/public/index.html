<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Docs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffffff'/%3E%3Cpath d='M8 7h11l5 5v13a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V10a3 3 0 0 1 3-3z' fill='%23e8f0fe' stroke='%234285f4' stroke-width='1.6'/%3E%3Cpath d='M10 15h12M10 19h12M10 23h8' stroke='%235f6368' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/shell.css">
</head>
<body>
<div id="app">

  <header id="chrome">
    <div class="brand" title="Umbra protocol v1 — everything below this line is one opaque browser page">
      <span class="mark"></span>
      <span class="word">umbra</span>
      <span class="v">1</span>
    </div>

    <div id="tabstrip" role="tablist" aria-label="Umbra tabs"></div>
    <button id="newtab" title="New Umbra tab (Ctrl+T)" aria-label="new tab">+</button>

    <div class="spacer"></div>

    <button class="ghost" id="cloakBtn" title="Rename + refavicon this browser tab so nothing is legible in the tab bar or history title">
      <span class="dot" id="cloakDot"></span> Cloak
    </button>
    <button class="ghost" id="splitBtn" title="Split view: show two Umbra tabs side by side">Split</button>
    <button class="danger" id="panicBtn" title="Panic: wipe all Umbra tabs, cookies and logs instantly (~ pressed twice also works)">Panic</button>
  </header>

  <div id="nav">
    <div class="navgroup">
      <button id="back" title="Back (in-tab history, never browser history)" aria-label="back">‹</button>
      <button id="fwd" title="Forward" aria-label="forward">›</button>
      <button id="reload" title="Reload this Umbra tab" aria-label="reload">↻</button>
      <button id="homeBtn" title="Umbra portal" aria-label="portal">◈</button>
    </div>

    <div id="addrwrap">
      <span id="schemabadge" title="Umbra is not http(s): the browser only ever sees this opaque origin">umbra://</span>
      <input id="addr" spellcheck="false" autocomplete="off" autocapitalize="off"
             placeholder="umbra://host/path, a URL, or words to search">
      <span id="hint" class="hint"></span>
      <button id="goBtn" title="Open in this tab (Enter)">Go</button>
      <button id="goNew" title="Open in a new Umbra tab">New tab</button>
    </div>

    <div class="navgroup">
      <label class="sel" title="How held redirects are treated">redirect
        <select id="polRedirect">
          <option value="same-host">split cross-host</option>
          <option value="all">follow all</option>
          <option value="none">split every hop</option>
        </select>
      </label>
      <label class="sel" title="What Referer the upstream sees">referer
        <select id="polReferrer">
          <option value="origin">origin only</option>
          <option value="none">none</option>
          <option value="full">full path</option>
        </select>
      </label>
    </div>
  </div>

  <div id="stage">
    <div class="panes" id="panes"></div>
    <div id="empty">
      <div class="emptycard">
        <h1>Umbra</h1>
        <p>A web proxy that speaks its own scheme. One browser history entry — this one — forever.</p>
        <button class="primary" id="emptyOpen">Open the portal</button>
      </div>
    </div>
  </div>

  <footer id="status">
    <span id="stLeft" class="mono"></span>
    <span class="dotsep"></span>
    <span id="stMid" class="mono"></span>
    <span class="grow"></span>
    <button id="logToggle" class="tiny">ledger</button>
    <span id="stRight" class="mono"></span>
  </footer>

  <aside id="log" hidden>
    <div class="loghead">
      <b>Umbra ledger</b>
      <span class="muted">session-local, memory only, never written to disk</span>
      <button id="logClose">×</button>
    </div>
    <div class="logbody" id="logBody"></div>
    <div class="logfoot">
      <button id="logClear" class="tiny">clear</button>
      <span class="muted" id="logStats"></span>
    </div>
  </aside>

  <div id="toasts"></div>

  <dialog id="cloakDlg">
    <form method="dialog">
      <h2>Tab cloak</h2>
      <p class="muted">Sets the outer browser tab's visible title and favicon. Nothing you open inside Umbra changes either.</p>
      <label>Tab title<input id="cloakTitle" value="Docs"></label>
      <label>Preset
        <select id="cloakPreset">
          <option value="Docs">Google Docs</option>
          <option value="Inbox — Mail">Email inbox</option>
          <option value="Assignment 4 — Canvas LMS">Canvas LMS</option>
          <option value="Q3 report · Sheets">Spreadsheet</option>
          <option value="README.md — editor">Code editor</option>
          <option value="⚙ Settings">Settings</option>
          <option value="__real__">no cloak (real title)</option>
        </select>
      </label>
      <label class="chk"><input type="checkbox" id="cloakTitleLock" checked> lock title against in-tab changes</label>
      <label class="chk"><input type="checkbox" id="cloakBurnOnLeave" checked> burn session if this page is closed by the user</label>
      <div class="row">
        <button value="apply" class="primary" id="cloakApply">Apply</button>
        <button value="cancel" class="ghost">Cancel</button>
      </div>
    </form>
  </dialog>
</div>
<script src="/shell.js"></script>
</body>
</html>
